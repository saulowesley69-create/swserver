plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.swgames.voxelmundo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.swgames.voxelmundo'
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '2.83'
    }

    // Chave fixa: cada APK novo instala por cima do antigo, sem perder os mundos.
    signingConfigs {
        debug {
            storeFile file('voxelmundo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // o jogo é um HTML grande: não comprimir deixa abrir mais rápido
    androidResources { noCompress 'html', 'mp3', 'png', 'jpg' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
