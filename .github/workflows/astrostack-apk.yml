name: AstroStack APK

# Só roda no branch "astrostack" — não mexe no deploy do site (main).
on:
  push:
    branches: [astrostack]
    paths:
      - 'AstroStack/**'
      - '.github/workflows/astrostack-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AstroStack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            # Mostra os erros como anotações (dá pra ler pela API pública)
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          }

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AstroStack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AstroStack-apk
          path: AstroStack/AstroStack.apk

      - name: Publicar em Releases (link direto pro celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: astrostack-v${{ github.run_number }}
          name: AstroStack v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AstroStack/AstroStack.apk
          body: |
            Baixe o **AstroStack.apk** abaixo e instale no Android.
            (Se pedir, permita "instalar apps de fontes desconhecidas".)
