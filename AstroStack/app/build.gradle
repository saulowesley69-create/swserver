plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.swgames.astrostack'
    compileSdk 34

    defaultConfig {
        applicationId 'com.swgames.astrostack'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    // Chave fixa: assim cada APK novo instala por cima do antigo, sem desinstalar.
    signingConfigs {
        debug {
            storeFile file('astrostack-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
